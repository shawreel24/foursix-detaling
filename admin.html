<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | FOURSIX DETAILING</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/logo/Foursix dns.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --surface: #0d0d0d;
    --surface-2: #111111;
    --surface-3: #161616;
    --text: #F2EFE9;
    --text-muted: #777;
    --text-dim: #aaa;
    --accent: #E84A27;
    --accent-dim: rgba(232, 74, 39, 0.12);
    --accent-glow: rgba(232, 74, 39, 0.25);
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --success: #4ade80;
    --warning: #fbbf24;
    --error: #f87171;
    --ease: cubic-bezier(0.19, 1, 0.22, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    font-size: 16px;
    background: var(--bg);
    overflow-x: hidden;
  }

  body {
    font-family: 'Manrope', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  a { text-decoration: none; color: inherit; }
  img { max-width: 100%; display: block; }

  /* ============================
     TOP NAV / HEADER
  ============================ */
  .admin-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,5,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .header-brand img {
    height: 36px;
    width: auto;
  }

  .header-brand-text {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .header-brand-text span {
    color: var(--text-muted);
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(232,74,39,0.2);
    border-radius: 100px;
    padding: 0.2rem 0.6rem;
    margin-left: 0.75rem;
    font-family: 'Oswald', sans-serif;
  }

  .header-badge::before {
    content: '';
    width: 5px;
    height: 5px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .header-admin-email {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .logout-btn {
    padding: 0.4rem 1rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: 'Oswald', sans-serif;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ============================
     TABS
  ============================ */
  .admin-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    background: var(--surface);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .admin-tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex-shrink: 0;
    padding: 1rem 1.5rem;
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    top: 1px;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* ============================
     MAIN CONTENT
  ============================ */
  .admin-main {
    padding: 2rem;
    max-width: 1600px;
    margin: 0 auto;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ============================
     STATS ROW
  ============================ */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    transition: border-color 0.2s;
  }

  .stat-card:hover { border-color: var(--border-hover); }

  .stat-card-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-family: 'Oswald', sans-serif;
    margin-bottom: 0.5rem;
  }

  .stat-card-value {
    font-family: 'Oswald', sans-serif;
    font-size: 2rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }

  .stat-card-value.accent { color: var(--accent); }

  /* ============================
     SECTION HEADER
  ============================ */
  .section-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .section-hdr h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-hdr h2::before {
    content: '';
    width: 16px;
    height: 2px;
    background: var(--accent);
  }

  .refresh-btn {
    padding: 0.4rem 0.9rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn svg { transition: transform 0.3s; }
  .refresh-btn:hover svg { transform: rotate(180deg); }

  /* ============================
     BOOKINGS TABLE
  ============================ */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .table-empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .table-empty svg {
    width: 48px;
    height: 48px;
    opacity: 0.2;
    margin: 0 auto 1rem;
    display: block;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  thead tr {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 0.875rem 1rem;
    text-align: left;
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 400;
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface-3); }

  td {
    padding: 1rem 1rem;
    color: var(--text-dim);
    vertical-align: middle;
  }

  td.bold { color: var(--text); font-weight: 500; }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'Oswald', sans-serif;
  }

  .badge-paid { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.2); }
  .badge-pending { background: rgba(251,191,36,0.1); color: var(--warning); border: 1px solid rgba(251,191,36,0.2); }
  .badge-ppf { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(232,74,39,0.2); }

  .action-btn {
    padding: 0.3rem 0.7rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.danger:hover { border-color: var(--error); color: var(--error); }

  /* ============================
     MODAL
  ============================ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    animation: overlayIn 0.2s ease;
  }

  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 580px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: modalIn 0.3s var(--ease);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: none; } }

  .modal-header {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1;
  }

  .modal-header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.4;
  }

  .modal-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 400;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 1.2rem;
    line-height: 1;
  }

  .modal-close:hover { border-color: var(--error); color: var(--error); }

  .modal-body { padding: 1.5rem; }

  .modal-section {
    margin-bottom: 1.5rem;
  }

  .modal-section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--accent-dim);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }

  .info-item { }

  .info-item label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-family: 'Oswald', sans-serif;
    margin-bottom: 0.2rem;
  }

  .info-item p {
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .edit-field {
    margin-bottom: 1rem;
  }

  .edit-field label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-family: 'Oswald', sans-serif;
    margin-bottom: 0.4rem;
  }

  .edit-field input,
  .edit-field select,
  .edit-field textarea {
    width: 100%;
    padding: 0.75rem 0.875rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .edit-field input:focus,
  .edit-field select:focus,
  .edit-field textarea:focus {
    border-color: rgba(232, 74, 39, 0.4);
  }

  .edit-field textarea { resize: vertical; min-height: 80px; }

  .edit-field select option { background: #111; }

  .modal-footer {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
    padding: 1.25rem 1.5rem;
    border-top: 1px solid var(--border);
    position: sticky;
    bottom: 0;
    background: var(--surface);
  }

  .save-btn {
    padding: 0.65rem 1.5rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .save-btn:hover { opacity: 0.88; }
  .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .cancel-btn {
    padding: 0.65rem 1.2rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text-muted);
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .cancel-btn:hover { border-color: var(--border-hover); color: var(--text); }

  /* ============================
     PRICING TABLE
  ============================ */
  .pricing-service {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .pricing-service-hdr {
    padding: 1rem 1.25rem;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  .pricing-service-hdr:hover { background: var(--surface-3); }

  .pricing-service-name {
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 400;
  }

  .pricing-chevron {
    color: var(--text-muted);
    transition: transform 0.3s;
    font-size: 0.8rem;
  }

  .pricing-service.open .pricing-chevron { transform: rotate(180deg); }

  .pricing-service-body {
    display: none;
    padding: 1rem 1.25rem;
  }

  .pricing-service.open .pricing-service-body { display: block; }

  .pricing-pkg {
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .pricing-pkg:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  .pricing-pkg-name {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 0.6rem;
  }

  .pricing-vehicles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
  }

  .pricing-vehicle label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-family: 'Oswald', sans-serif;
    margin-bottom: 0.3rem;
  }

  .pricing-vehicle input {
    width: 100%;
    padding: 0.5rem 0.65rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .pricing-vehicle input:focus {
    border-color: rgba(232,74,39,0.4);
  }

  .save-pricing-btn {
    margin-top: 1.5rem;
    padding: 0.75rem 2rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .save-pricing-btn:hover { opacity: 0.88; }

  /* ============================
     TOAST
  ============================ */
  .toast-container {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .toast {
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    font-size: 0.82rem;
    font-family: 'Manrope', sans-serif;
    animation: toastIn 0.3s var(--ease), toastOut 0.3s var(--ease) 2.7s both;
    max-width: 320px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .toast.success { background: #0f2e1a; border: 1px solid rgba(74,222,128,0.25); color: var(--success); }
  .toast.error { background: #2e0f0f; border: 1px solid rgba(248,113,113,0.25); color: var(--error); }

  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* ============================
     LOADING
  ============================ */
  .loading-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================
     RESPONSIVE
  ============================ */
  @media (max-width: 768px) {
    .admin-main { padding: 1rem; }
    .info-grid { grid-template-columns: 1fr; }
    .pricing-vehicles { grid-template-columns: 1fr 1fr; }
    th:nth-child(n+4), td:nth-child(n+4) { display: none; }
    .header-admin-email { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="admin-header">
  <div class="header-brand">
    <img src="assets/logo/Foursix dns.png" alt="FourSix Detailing">
    <span class="header-brand-text">FOUR<span>SIX</span> <span>DETAILING</span></span>
    <span class="header-badge">Admin</span>
  </div>
  <div class="header-actions">
    <span class="header-admin-email" id="adminEmailDisplay"></span>
    <a href="index.html" style="font-size:0.75rem;color:var(--text-muted);margin-right:0.25rem;">View Site</a>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<!-- TABS -->
<nav class="admin-tabs">
  <button class="tab-btn active" data-tab="orders">Orders</button>
  <button class="tab-btn" data-tab="pricing">Pricing</button>
</nav>

<!-- MAIN -->
<main class="admin-main">

  <!-- ============================
       ORDERS TAB
  ============================ -->
  <div class="tab-content active" id="tab-orders">
    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-card-label">Total Bookings</div>
        <div class="stat-card-value" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">PPF (Paid)</div>
        <div class="stat-card-value accent" id="statPaid">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">WhatsApp Requests</div>
        <div class="stat-card-value" id="statWa">—</div>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="section-hdr">
      <h2>All Orders</h2>
      <button class="refresh-btn" id="refreshBookingsBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Refresh
      </button>
    </div>

    <div class="table-wrap" id="bookingsTableWrap">
      <div class="loading-state">
        <div class="spinner"></div>
        Loading bookings...
      </div>
    </div>
  </div>

  <!-- ============================
       PRICING TAB
  ============================ -->
  <div class="tab-content" id="tab-pricing">
    <div class="section-hdr">
      <h2>Service Pricing</h2>
      <button class="refresh-btn" id="refreshPricingBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Reset
      </button>
    </div>
    <div id="pricingContainer">
      <div class="loading-state">
        <div class="spinner"></div>
        Loading pricing...
      </div>
    </div>
    <button class="save-pricing-btn" id="savePricingBtn" style="display:none;">Save Pricing Changes</button>
  </div>

</main>

<!-- BOOKING EDIT MODAL -->
<div class="modal-overlay" id="bookingModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Booking</span>
      <button class="modal-close" id="closeModalBtn">&#215;</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Populated by JS -->
    </div>
    <div class="modal-footer">
      <button class="cancel-btn" id="cancelModalBtn">Cancel</button>
      <button class="save-btn" id="saveBookingBtn">Save Changes</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script src="assets/js/site-config.js"></script>
<script>
// ================================================
// AUTH GUARD
// ================================================
const adminToken = sessionStorage.getItem('fs_admin_token');
if (!adminToken) {
  window.location.replace('admin-login.html?v=4');
}

document.getElementById('adminEmailDisplay').textContent = 'valapclawmkima81@gmail.com';

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('fs_admin_auth');
  sessionStorage.removeItem('fs_admin_token');
  window.location.replace('admin-login.html?v=4');
});

// ================================================
// HELPERS
// ================================================
function getApiUrl(path) {
  const baseUrl = window.FOURSIX_CONFIG?.apiBaseUrl?.replace(/\/$/, '') || '';
  if (baseUrl.includes('supabase.co')) {
    return `${baseUrl}${path.replace('/api/admin', '/foursix-admin')}`;
  }
  return `${baseUrl}${path}`;
}

function authHeaders() {
  return { 'Authorization': `Bearer ${adminToken}`, 'Content-Type': 'application/json' };
}

function toast(message, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

// ================================================
// TABS
// ================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ================================================
// BOOKINGS
// ================================================
let allBookings = [];
let currentEditId = null;

async function loadBookings() {
  const wrap = document.getElementById('bookingsTableWrap');
  wrap.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading bookings...</div>';

  try {
    const res = await fetch(getApiUrl('/api/admin/bookings'), { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    allBookings = data.bookings || [];
    renderBookings();
    updateStats();
  } catch (err) {
    wrap.innerHTML = '<div class="loading-state">Failed to load bookings. Is the server running?</div>';
  }
}

function updateStats() {
  const ppfPaid = allBookings.filter(b => b.serviceKey === 'paintProtectionFilm' && b.razorpayPaymentId);
  const waReqs = allBookings.filter(b => !b.razorpayPaymentId);
  document.getElementById('statTotal').textContent = allBookings.length;
  document.getElementById('statPaid').textContent = ppfPaid.length;
  document.getElementById('statWa').textContent = waReqs.length;
}

function renderBookings() {
  const wrap = document.getElementById('bookingsTableWrap');

  if (allBookings.length === 0) {
    wrap.innerHTML = `
      <div class="table-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        No bookings yet. Bookings will appear here once customers make requests.
      </div>`;
    return;
  }

  const rows = allBookings.map(b => {
    const isPaid = !!b.razorpayPaymentId;
    const badge = isPaid
      ? `<span class="badge badge-paid">Paid</span>`
      : (b.serviceKey === 'paintProtectionFilm'
          ? `<span class="badge badge-ppf">PPF</span>`
          : `<span class="badge badge-pending">WhatsApp</span>`);

    return `<tr data-id="${b.bookingId}" onclick="openEditModal('${b.bookingId}')">
      <td class="bold">${b.bookingId || '—'}</td>
      <td>${b.customer?.name || '—'}</td>
      <td>${b.customer?.phone || '—'}</td>
      <td>${b.service || '—'}</td>
      <td>${b.package || '—'}</td>
      <td>${b.vehicle || '—'}</td>
      <td class="bold">${b.totalPrice || '—'}</td>
      <td>${badge}</td>
      <td>${formatDate(b.paidAt || b.createdAt)}</td>
      <td onclick="event.stopPropagation()">
        <div style="display:flex;gap:0.4rem;">
          <button class="action-btn" onclick="openEditModal('${b.bookingId}')">Edit</button>
          <button class="action-btn danger" onclick="deleteBooking('${b.bookingId}')">Del</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Service</th>
          <th>Package</th>
          <th>Vehicle</th>
          <th>Price</th>
          <th>Status</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ================================================
// EDIT MODAL
// ================================================
function openEditModal(bookingId) {
  const b = allBookings.find(x => x.bookingId === bookingId);
  if (!b) return;
  currentEditId = bookingId;

  const isPaid = !!b.razorpayPaymentId;
  const status = isPaid ? 'Paid (PPF)' : 'WhatsApp Request';

  document.getElementById('modalBody').innerHTML = `
    <!-- Info Section -->
    <div class="modal-section">
      <div class="modal-section-title">Booking Info</div>
      <div class="info-grid">
        <div class="info-item"><label>Booking ID</label><p>${b.bookingId || '—'}</p></div>
        <div class="info-item"><label>Status</label><p>${status}</p></div>
        <div class="info-item"><label>Date</label><p>${formatDate(b.paidAt || b.createdAt)}</p></div>
        ${isPaid ? `<div class="info-item"><label>Payment ID</label><p style="font-size:0.75rem;">${b.razorpayPaymentId || '—'}</p></div>` : ''}
      </div>
    </div>

    <!-- Customer Section -->
    <div class="modal-section">
      <div class="modal-section-title">Customer Details</div>
      <div class="edit-field">
        <label>Customer Name</label>
        <input type="text" id="editName" value="${b.customer?.name || ''}" placeholder="Customer name">
      </div>
      <div class="edit-field">
        <label>Phone Number</label>
        <input type="tel" id="editPhone" value="${b.customer?.phone || ''}" placeholder="Phone number">
      </div>
    </div>

    <!-- Service Section -->
    <div class="modal-section">
      <div class="modal-section-title">Service Details</div>
      <div class="edit-field">
        <label>Service</label>
        <input type="text" id="editService" value="${b.service || ''}" placeholder="Service name">
      </div>
      <div class="edit-field">
        <label>Package</label>
        <input type="text" id="editPackage" value="${b.package || ''}" placeholder="Package">
      </div>
      <div class="edit-field">
        <label>Vehicle Type</label>
        <input type="text" id="editVehicle" value="${b.vehicle || ''}" placeholder="Vehicle type">
      </div>
    </div>

    <!-- Pricing Section -->
    <div class="modal-section">
      <div class="modal-section-title">Pricing</div>
      <div class="edit-field">
        <label>Total Price</label>
        <input type="text" id="editTotalPrice" value="${b.totalPrice || ''}" placeholder="e.g. Rs. 15,000">
      </div>
      <div class="edit-field">
        <label>Prepaid Amount</label>
        <input type="text" id="editPrepaid" value="${b.prepaidAmount || ''}" placeholder="e.g. Rs. 10,000">
      </div>
      <div class="edit-field">
        <label>Balance Amount</label>
        <input type="text" id="editBalance" value="${b.balanceAmount || ''}" placeholder="e.g. Rs. 5,000">
      </div>
    </div>

    <!-- Notes Section -->
    <div class="modal-section">
      <div class="modal-section-title">Notes</div>
      <div class="edit-field">
        <label>Booking Notes</label>
        <textarea id="editNotes" placeholder="Any notes...">${b.notes || ''}</textarea>
      </div>
    </div>
  `;

  document.getElementById('bookingModal').classList.add('open');
}

function closeModal() {
  document.getElementById('bookingModal').classList.remove('open');
  currentEditId = null;
}

document.getElementById('closeModalBtn').addEventListener('click', closeModal);
document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
document.getElementById('bookingModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('saveBookingBtn').addEventListener('click', async () => {
  if (!currentEditId) return;

  const btn = document.getElementById('saveBookingBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const updates = {
    customer: {
      name: document.getElementById('editName').value.trim(),
      phone: document.getElementById('editPhone').value.trim()
    },
    service: document.getElementById('editService').value.trim(),
    package: document.getElementById('editPackage').value.trim(),
    vehicle: document.getElementById('editVehicle').value.trim(),
    totalPrice: document.getElementById('editTotalPrice').value.trim(),
    prepaidAmount: document.getElementById('editPrepaid').value.trim(),
    balanceAmount: document.getElementById('editBalance').value.trim(),
    notes: document.getElementById('editNotes').value.trim()
  };

  try {
    const res = await fetch(getApiUrl(`/api/admin/bookings/${currentEditId}`), {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify(updates)
    });

    if (!res.ok) throw new Error('Failed to save');

    const updated = await res.json();

    // Update local data
    const idx = allBookings.findIndex(b => b.bookingId === currentEditId);
    if (idx !== -1) allBookings[idx] = updated.booking;

    renderBookings();
    updateStats();
    closeModal();
    toast('Booking updated successfully!', 'success');
  } catch {
    toast('Failed to save changes.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
});

async function deleteBooking(bookingId) {
  if (!confirm(`Delete booking ${bookingId}? This cannot be undone.`)) return;

  try {
    const res = await fetch(getApiUrl(`/api/admin/bookings/${bookingId}`), {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (!res.ok) throw new Error();
    allBookings = allBookings.filter(b => b.bookingId !== bookingId);
    renderBookings();
    updateStats();
    toast('Booking deleted.', 'success');
  } catch {
    toast('Failed to delete booking.', 'error');
  }
}

document.getElementById('refreshBookingsBtn').addEventListener('click', loadBookings);

// ================================================
// PRICING
// ================================================
let currentPricing = null;

async function loadPricing() {
  const container = document.getElementById('pricingContainer');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading pricing...</div>';

  try {
    const res = await fetch(getApiUrl('/api/admin/pricing'), { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    currentPricing = data.pricing;
    renderPricing();
    document.getElementById('savePricingBtn').style.display = 'block';
  } catch {
    container.innerHTML = '<div class="loading-state">Failed to load pricing data.</div>';
  }
}

function renderPricing() {
  const container = document.getElementById('pricingContainer');
  if (!currentPricing) return;

  container.innerHTML = Object.entries(currentPricing).map(([serviceKey, service]) => {
    const pkgHtml = service.packages.map((pkg, pkgIdx) => {
      const vehicleHtml = ['small', 'sedan', 'suv'].map(v => `
        <div class="pricing-vehicle">
          <label>${v === 'small' ? 'Small Car' : v === 'sedan' ? 'Sedan' : 'SUV'}</label>
          <input
            type="text"
            data-service="${serviceKey}"
            data-pkg="${pkgIdx}"
            data-vehicle="${v}"
            value="${pkg.prices[v]}"
            placeholder="Price or 'Custom quote'"
          >
        </div>
      `).join('');

      return `
        <div class="pricing-pkg">
          <div class="pricing-pkg-name">${pkg.label}</div>
          <div class="pricing-vehicles">${vehicleHtml}</div>
        </div>`;
    }).join('');

    return `
      <div class="pricing-service" id="ps-${serviceKey}">
        <div class="pricing-service-hdr" onclick="togglePricingService('${serviceKey}')">
          <span class="pricing-service-name">${service.label}</span>
          <span class="pricing-chevron">▼</span>
        </div>
        <div class="pricing-service-body">${pkgHtml}</div>
      </div>`;
  }).join('');
}

function togglePricingService(key) {
  document.getElementById('ps-' + key).classList.toggle('open');
}

document.getElementById('refreshPricingBtn').addEventListener('click', loadPricing);

document.getElementById('savePricingBtn').addEventListener('click', async () => {
  if (!currentPricing) return;

  const btn = document.getElementById('savePricingBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  // Collect all input values and build updated pricing
  const updated = JSON.parse(JSON.stringify(currentPricing));
  document.querySelectorAll('.pricing-vehicle input').forEach(input => {
    const { service, pkg, vehicle } = input.dataset;
    const raw = input.value.trim();
    const num = Number(raw.replace(/,/g, ''));
    updated[service].packages[parseInt(pkg)].prices[vehicle] = isNaN(num) || raw === '' ? raw : num;
  });

  try {
    const res = await fetch(getApiUrl('/api/admin/pricing'), {
      method: 'PUT',
      headers: authHeaders(),
      body: JSON.stringify({ pricing: updated })
    });

    if (!res.ok) throw new Error();

    currentPricing = updated;
    toast('Pricing updated successfully!', 'success');
  } catch {
    toast('Failed to save pricing.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Pricing Changes';
  }
});

// ================================================
// LOGOUT
// ================================================
function logout() {
  sessionStorage.removeItem('fs_admin_auth');
  sessionStorage.removeItem('fs_admin_token');
  window.location.replace('admin-login.html?v=4');
}

// ================================================
// INIT
// ================================================
loadBookings();
loadPricing();
</script>
</body>
</html>
