<link rel="stylesheet" href="assets/css/style.css">
<style>
  .dev-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 4rem 2rem;
    text-align: center;
  }

  .dev-kicker {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    justify-content: center;
  }

  .dev-kicker::before {
    content: '';
    display: block;
    width: 2rem;
    height: 2px;
    background: var(--accent);
  }

  .dev-name {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .dev-role {
    font-size: 1rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .dev-divider {
    width: 3rem;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 3rem;
  }

  .dev-phone {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
    margin-bottom: 2rem;
  }

  .dev-whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    padding: 1rem 2.5rem;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: opacity 0.2s ease, transform 0.2s ease;
    border-radius: 0;
  }

  .dev-whatsapp:hover {
    opacity: 0.85;
    transform: translateY(-2px);
  }

  .dev-whatsapp svg {
    width: 1.25rem;
    height: 1.25rem;
    fill: #fff;
  }

  .dev-back {
    margin-top: 3rem;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .dev-back:hover {
    color: var(--accent);
  }
</style>
